name: Kubernetes CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login To Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/demo-app:${{ github.run_number }} .

      - name: Push Docker Image
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/demo-app:${{ github.run_number }}

      - name: Copy Kubernetes Manifests
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "k8s/*"
          target: "/home/ubuntu/project"

      - name: Deploy To Kubernetes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "===== Cluster Information ====="
            kubectl get nodes

            cd /home/ubuntu/project/k8s

            echo "===== Applying Deployment ====="
            kubectl apply -f deployment.yml

            echo "===== Applying Service ====="
            kubectl apply -f service.yml

            echo "===== Updating Image ====="
            kubectl set image deployment/demo-app \
            demo-app=${{ secrets.DOCKER_USERNAME }}/demo-app:${{ github.run_number }}

            echo "===== Waiting For Rollout ====="
            kubectl rollout status deployment/demo-app

            nohup kubectl port-forward \
            service/demo-app-service \
            8080:3000 \
            --address 0.0.0.0 \
            > /tmp/port-forward.log 2>&1 &

            sleep 5

            echo "===== Verification ====="

            kubectl get deployments

            kubectl get pods

            kubectl get svc

            ps -ef | grep port-forward | grep -v grep

            echo "Application URL:"
            echo "http://${{ secrets.EC2_HOST }}:8080"
